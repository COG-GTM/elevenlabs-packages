policy:
  approval:
    - or:
        - convai-widget changes approved by widget team
        - client changes approved by owner
        - react and example changes approved by owner
        - other changes approved by a maintainer

approval_rules:
  - name: convai-widget changes approved by widget team
    description: ConvAI widget changes require approval from the widget team
    if:
      changed_files:
        paths:
          - "^packages/convai-widget-core/.*$"
          - "^packages/convai-widget-embed/.*$"
    requires:
      count: 1
      users: ["kamilk-11", "kalvin807", "giannagerton"]
    options: &default_options
      allow_author: false
      allow_contributor: false
      allow_non_author_contributor: false
      # An approval only covers the commits the reviewer saw. Merges from the
      # base branch do not reset approvals.
      invalidate_on_push: true
      ignore_update_merges: true
      # Only GitHub reviews count; comment approvals ("LGTM", ":+1:") cannot be
      # dismissed by GitHub and are tied to no specific commit.
      methods:
        github_review: true
        comment_patterns: []
        comments: []
      request_review:
        enabled: true
        mode: all-users

  - name: client changes approved by owner
    description: Client and types package changes require approval from a package owner
    if:
      changed_files:
        paths:
          - "^packages/client/.*$"
          - "^packages/types/.*$"
    requires:
      count: 1
      users: &sdk_owners ["PaulAsjes", "AngeloGiacco", "kraenhansen"]
    options:
      <<: *default_options

  - name: react and example changes approved by owner
    description: React, React Native and example app changes require approval from a package owner
    if:
      changed_files:
        paths:
          - "^packages/react/.*$"
          - "^packages/react-native/.*$"
          - "^examples/react-native-expo/.*$"
          - "^examples/agent-testbench/.*$"
    requires:
      count: 1
      users: *sdk_owners
    options:
      <<: *default_options

  # Must not apply when an owned path changes; the top-level "or" would
  # otherwise let a maintainer approval bypass the owners. Keep this list in
  # sync with the paths of the rules above.
  - name: other changes approved by a maintainer
    description: Changes outside the owned packages require approval from a maintainer
    if:
      no_changed_files:
        paths:
          - "^packages/convai-widget-core/.*$"
          - "^packages/convai-widget-embed/.*$"
          - "^packages/client/.*$"
          - "^packages/types/.*$"
          - "^packages/react/.*$"
          - "^packages/react-native/.*$"
          - "^examples/react-native-expo/.*$"
          - "^examples/agent-testbench/.*$"
    requires:
      count: 1
      permissions: ["write"]
    options:
      <<: *default_options
      request_review:
        enabled: false
